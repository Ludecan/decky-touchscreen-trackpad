[global]
enabled = true

[input]
# Drop touch frames older than this many milliseconds before processing.
max_touch_frame_age_ms = 60

[region]
# Active trackpad area as fractions of the full screen (0.0 = left/top, 1.0 = right/bottom).
# Default: right half of the screen.
x_min = 0.5
x_max = 1.0
y_min = 0.0
y_max = 1.0

[motion]
# Base movement multiplier.
sensitivity = 3.1
# How strongly speed amplifies movement (0.0 = off).
accel_strength = 0.4
# Power-law exponent for the acceleration curve.
accel_exponent = 1.2
# Smoothing strength (0.0 = crisp / no smoothing, 1.0 = maximum smoothing).
smoothing = 0.1
# Minimum per-frame delta magnitude (in screen fractions) required to register
# movement. On a ~240 Hz touchscreen each frame's delta is tiny, so keep this
# small (0.0-0.002); large values erase slow motion and cause chop.
deadzone = 0.00005

[inertia]
# Trackball-style glide. Starts when movement stops (a still finger, pressed or
# lifted, decays the last velocity to a stop) rather than only on lift.
enabled = true
# Stopping strength (0.0 = longest glide, 1.0 = stops immediately).
friction = 0.35
# Stop inertia when speed drops below this value.
cutoff = 0.001

[multitouch]
# While the tracked finger is down, ignore extra simultaneous contacts so a
# tilting thumb or resting fingers cannot jump the cursor. With it off, the
# most recent contact takes over tracking (re-anchored, still no jump).
enabled = true

[tap]
# Enable tap-to-click when the touch is short and stays nearly still.
enabled = true
# Maximum contact duration in milliseconds for a tap.
max_duration_ms = 180
# Maximum total finger travel, in normalized screen fractions, for a tap.
max_movement = 0.02

[output]
# Which virtual output devices to create. The virtual gamepad shares the Xbox
# 360 VID/PID (045e:028e), so some games (e.g. uzdoom) also pick it up as a
# second controller and double-apply aim. For mouse-driven games set
# gamepad = false (and mouse = true); restarting the daemon is required for
# changes here to take effect.
mouse = true
gamepad = false
